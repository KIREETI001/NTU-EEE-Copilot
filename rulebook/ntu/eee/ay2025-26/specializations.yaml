# =============================================================================
# SPECIALIZATIONS  —  NTU / EEE / AY2025-26
# =============================================================================
# 8 Final-Year Area Specializations. Codes are COHORT-VERSIONED: AY2025-26
# renumbered several design electives (e.g. EE4503->EE4523, EE4303->EE4323,
# EE4207->EE4227). A student's valid code set depends on their final-year AY.
# `avail` (S1/S2) is a SOFT attribute — flagged subject to change.
# =============================================================================

recognition_rules:
  confidence: "verified"
  major_pe_required_for_degree: 5      # must complete 5 Major PEs for the B.Eng
  min_au_single_area: 15               # to be RECOGNIZED as specialized
  min_design_electives: 1
  min_technical_electives: 2
  must_be_letter_graded: true
  fgo_excluded: true                   # FGO'd courses do NOT count toward a specialization
  max_specializations: 2
  no_double_count: true                # a course can't count to >1 spec / 2nd major / minor
  valid_combinations:                  # ways to reach the 15 AU with >=1 design + >=2 technical
    - "1 Design + 4 Technical"
    - "2 Design + 3 Technical"
    - "3 Design + 2 Technical"

year3_major_prescribed_electives:      # the 9 MPEs (Yr3 prerequisites). VERIFIED current.
  confidence: "verified"
  list:
    - { code: "EE3011", title: "Modelling & Control",                 avail: ["S1","S2"] }
    - { code: "EE3013", title: "Semiconductor Devices & Processing",  avail: ["S1","S2"] }
    - { code: "EE3015", title: "Power Systems & Conversion",          avail: ["S1","S2"] }
    - { code: "EE3018", title: "Introduction to Photonics",           avail: ["S1"] }
    - { code: "EE3019", title: "Integrated Electronics / IC Design",  avail: ["S1","S2"] }
    - { code: "IE3012", title: "Communication Principles",            avail: ["S1","S2"] }
    - { code: "IE3014", title: "Digital Signal Processing",           avail: ["S1","S2"] }
    - { code: "IE3017", title: "Computer Communications",             avail: ["S1","S2"] }
    - { code: "IE3102", title: "Microprocessor",                      avail: ["S1","S2"] }

